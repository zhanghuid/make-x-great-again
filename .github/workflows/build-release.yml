name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.5.0)'
        required: true
        type: string
      pre_release:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build Chrome extension
        working-directory: extension
        run: |
          npm run build
          npm run zip
        env:
          NODE_ENV: production

      - name: Build Firefox extension
        working-directory: extension
        run: |
          npm run build:firefox
          npm run zip:firefox
        env:
          NODE_ENV: production

      - name: List built artifacts
        run: |
          echo "=== Built artifacts ==="
          ls -lah extension/.output/ || echo "No .output directory"
          find extension -name "*.zip" -type f 2>/dev/null || echo "No zip files found"

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat > /tmp/release-body.md << 'NOTES'
          ## 🎯 核心变化

          **扩展现在完全离线运行** — 零网络请求

          - ✅ 移除最后一条网络调用：误判申诉改为打开 GitHub Issue 模板
          - ✅ 扩展消费端不再依赖任何远程端点，本地黑名单完全自给自足
          - ✅ 符合 AMO 的 `data_collection: "none"` 声明

          ## 🔧 工程改进

          ### 扩展端
          - 删除过时代码：GraphQL 拦截、GitHub Device Flow、whitelist 缓存
          - 隐藏语义正确：`拉黑` → `隐藏`（本地操作，非 X Block API）
          - XSS 加固：badge popover 转义
          - Firefox min 109.0 支持

          ### 工具链 & 边缘服务
          - **Bloom 过滤器**自适应大小
          - **LLM 加固**：prompt-injection 防护
          - **黑名单编译**：条目验证、138 行删除、dedup
          - **Endpoint 加固**：速率限制、timing-safe token
          - **定时任务拆分**：GitHub mirror 仅 6h trigger
          - **Artifact URL-safe**：版本前缀映射修复

          ## 🔒 隐私改进

          **100% 离线** — 零网络请求

          | 功能 | v0.4.0 | v0.5.0 |
          |------|--------|--------|
          | 列表匹配 | `/v1/check` | 本地 blacklist |
          | 申诉 | POST `/v1/appeal` | GitHub Issue |
          | 隐藏 | X Block API | 本地 DOM |

          ## ✅ 测试

          - TypeScript strict + Biome lint ✅
          - 9 条 edge 端点测试 ✅
          - Bloom FPR + golden-vector ✅

          ---

          **首次完全离线发布。** 所有智能在你的浏览器中运行，零外呼。🚀
          NOTES
          echo "body_file=/tmp/release-body.md" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            extension/.output/mxga-extension-${{ steps.version.outputs.version }}-chrome.zip
            extension/.output/mxga-extension-${{ steps.version.outputs.version }}-firefox.zip
          body_path: ${{ steps.release_notes.outputs.body_file }}
          draft: false
          prerelease: ${{ github.event.inputs.pre_release || false }}
          fail_on_unmatched_files: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "✅ Release created successfully!"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "🔗 URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}"
          echo "📁 Files uploaded:"
          echo "  - mxga-extension-${{ steps.version.outputs.version }}-chrome.zip"
          echo "  - mxga-extension-${{ steps.version.outputs.version }}-firefox.zip"
